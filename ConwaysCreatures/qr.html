<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Scanner</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    overflow: hidden;
}

video {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    object-fit: cover;
    background: black;
}

#mainMenu {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    padding: 24px 16px;
    overflow: auto;
    isolation: isolate;
    background: #081226;
}

#mainMenu::after {
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, rgba(5, 12, 30, 0.08) 25%, rgba(5, 8, 18, 0.9) 78%, #050811 100%);
    content: "";
}

.menu-art {
    position: absolute;
    inset: 0;
    z-index: -2;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}

.menu-panel {
    width: min(100%, 520px);
    padding: 20px 0 0;
    text-align: center;
}

.menu-kicker {
    margin: 0 0 6px;
    color: #9edfff;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.24em;
    text-transform: uppercase;
}

.menu-title {
    margin: 0;
    color: #fff;
    font-size: clamp(30px, 9vw, 54px);
    line-height: 0.95;
    letter-spacing: 0.04em;
    text-shadow: 0 3px 18px rgba(50, 169, 255, 0.55);
}

.menu-subtitle {
    margin: 10px 0 18px;
    color: #c9d6e8;
    font-size: 14px;
}

#mainMenu > .menu-panel > button {
    width: 100%;
    min-height: 72px;
    margin-top: 10px;
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 10px;
    color: white;
    font-size: 18px;
    font-weight: bold;
    touch-action: manipulation;
}

.scan-button {
    background: linear-gradient(100deg, #1274d8, #25b7e9);
}

.battle-button {
    background: linear-gradient(100deg, #a9254d, #e23e57);
}

#cards {
    max-height: 20vh;
    overflow: auto;
    margin-top: 14px;
    padding: 8px;
    background: rgba(3, 8, 20, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 8px;
    box-sizing: border-box;
    word-wrap: break-word;
}

#result {
    position: fixed;
    bottom: 112px;
    left: 0;
    z-index: 4;
    width: 100%;
    padding: 10px 12px;
    background: rgba(0, 0, 0, 0.8);
    font-size: clamp(16px, 4vw, 22px);
    word-wrap: break-word;
}

#cancelScan {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 2;
    display: none;
    padding: 12px 18px;
    border: none;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.9);
    color: black;
    font-size: 18px;
    font-weight: bold;
}

#battleField {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
}

.controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 3;
    display: flex;
    gap: 10px;
    min-height: 112px;
    padding: 12px;
    background: rgba(0, 0, 0, 0.9);
}

button {
    min-height: 96px;
    padding: 16px;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
    touch-action: manipulation;
}

.controls button {
    flex: 1;
}

.divInner {
    min-width: 0;
    min-height: 0;
    border: 1px solid #777;
    font-size: 8px;
    background: rgba(255,255,255,0.08);
    color: white;
    overflow: hidden;
}

.divInner[data-team="blue"] {
    background: rgba(59, 130, 246, 0.9);
    color: #dbeafe;
}

.divInner[data-team="red"] {
    background: rgba(239, 68, 68, 0.9);
    color: #fee2e2;
}

.container {
    display: grid;
    grid-template-columns: repeat(40, minmax(0, 1fr));
    grid-template-rows: repeat(140, minmax(0, 1fr));
    width: 100%;
    height: 100%;
}

.container br {
    display: none;
}
</style>
</head>
<body>
<div id="mainMenu">
    <img class="menu-art" src="images/voxel-battle.svg" alt="Blue and red voxel Conway creatures battling">
    <div class="menu-panel">
        <p class="menu-kicker">Cellular Arena</p>
        <h1 class="menu-title">Conway's Creatures</h1>
        <p class="menu-subtitle">Build your living army. Start the evolution.</p>
        <button class="scan-button" onclick="scanQR()">カード追加</button>
        <button class="battle-button" onclick="initBattle()">クリーチャーをフィールドに置く</button>
        <div id="cards"></div>
    </div>
</div>
<div id="battleField"></div>
<video id="video" autoplay playsinline></video>
<button id="cancelScan" onclick="cancelScan()">キャンセル</button>
<div id="result">Starting camera...</div>

<script>
function makePattern(...rows) {
    const width = rows.reduce((max, row) => Math.max(max, row.length), 0);
    return rows.map(row => row.padEnd(width, '.').replace(/#/g, '■').replace(/\./g, ' '));
}

var creatures = {
    Glider1: makePattern(".#.", "#..", "###"),
    gun1: makePattern(".#.", "###", ".#."),
    Blinker: makePattern("###"),
    Toad: makePattern(".###", "###."),
    Beacon: makePattern("##..", "##..", "..##", "..##"),
    Acorn: makePattern(".#.", "..#", "###"),
    Boat: makePattern("##.", "#.#", ".#."),
    Loaf: makePattern(".##.", "##.#", "#..#", ".#.#"),
    Tub: makePattern(".#.", "###", ".#."),
    Eater: makePattern("##.", "#.#", "###"),
    Diamond: makePattern("..#..", ".#.#.", "#####", ".#.#.", "..#.."),
    Cross: makePattern(".#.", "###", ".#."),
    LongBar: makePattern("#####", "#####", "#####"),
    Puffer: makePattern("###", "#.#", "###"),
    Barge: makePattern("##.", "#.#", ".##"),
    Cannon: makePattern(".##.", "#..#", "#..#", ".##."),
    Pentadecathlon: makePattern("..#..", ".###.", "###", ".###.", "..#.."),
    Glider: makePattern(".#.", "#..", "###"),
    Sailboat: makePattern(".##.", "##.#", "#..#", ".#.#"),
    Crown: makePattern(".#.#.", "#####", ".###.", "..#.."),
    Heart: makePattern(".#.#.", "#####", ".###.", "..#.."),
    Mango: makePattern("..##.", ".####", "####.", ".##.."),
    Tumbler: makePattern(".##..##.", ".##..##.", "..####..", "..####.."),
    LightweightSpaceship: makePattern(".##.", "#..#", "####", "..##"),
    MiddleweightSpaceship: makePattern("..##.", ".#..#", "#...#", "#####"),
    HeavyweightSpaceship: makePattern("..###.", ".#...#", "#....#", "######"),
    Block: makePattern("##", "##"),
    Beehive: makePattern(".##.", "#..#", ".##."),
    Pond: makePattern(".##.", "#..#", "#..#", ".##."),
    BlockPair: makePattern("##..##", "##..##"),
    Snake: makePattern("##..", "#..#", "..##"),
    AircraftCarrier: makePattern("##..", "#..#", "..##"),
    BlockCluster: makePattern("##..##..##", "##..##..##"),
    DoubleBlock: makePattern("##..##", "##..##"),
    HoneyFarm: makePattern(".##..##.", "#..##..#", ".##..##."),
    Ship: makePattern("##..", "#.#.", ".#.."),
    SnakePit: makePattern(".##..##.", "#..##..#", ".##..##."),
    Clock: makePattern(".##.", "#..#", ".##.", "#..#"),
    FigureEight: makePattern(".##.", "#..#", ".##.", ".##.", "#..#", ".##."),
    KokGalaxy: makePattern("##..##", "#....#", "..##..", "..##..", "#....#", "##..##"),
    Rpentomino: makePattern(".##", "##.", ".#."),
    Diehard: makePattern("......#.", "##......", ".#...###"),
    Rabbits: makePattern("##...##", "..#.#..", "..#.#..", "...#..."),
    PufferTrain: makePattern("##...##", "#.#.#.#", "..###..", "...#..."),
    Pufferfish: makePattern(".###.", "#...#", "#####", "..#.."),
    LightweightSpaceship2: makePattern("..##.", ".#..#", "#...#", "#####"),
    Snail: makePattern("..##.", ".#..#", "#...#", ".####"),
    Dart: makePattern("..#..", ".###.", "#####", "..#.."),
    Spider: makePattern("##..##", "..##..", "##..##"),
    QueenBee: makePattern(".##...##.", "#..#.#..#", ".##...##.")
};

var creatureCategories = {
    Glider1: "Spaceship", gun1: "Oscillator", Blinker: "Oscillator", Toad: "Oscillator",
    Beacon: "Oscillator", Acorn: "Methuselah", Boat: "Still Life", Loaf: "Still Life",
    Tub: "Still Life", Eater: "Still Life", Diamond: "Still Life", Cross: "Still Life",
    LongBar: "Still Life", Puffer: "Puffer Train", Barge: "Still Life", Cannon: "Still Life",
    Pentadecathlon: "Oscillator", Glider: "Spaceship", Sailboat: "Spaceship",
    Crown: "Still Life", Heart: "Still Life", Mango: "Still Life", Tumbler: "Oscillator",
    LightweightSpaceship: "Spaceship", MiddleweightSpaceship: "Spaceship", HeavyweightSpaceship: "Spaceship",
    Block: "Still Life", Beehive: "Still Life", Pond: "Still Life", BlockPair: "Still Life",
    Snake: "Still Life", AircraftCarrier: "Still Life", BlockCluster: "Still Life", DoubleBlock: "Still Life",
    HoneyFarm: "Still Life", Ship: "Still Life", SnakePit: "Still Life", Clock: "Oscillator",
    FigureEight: "Oscillator", KokGalaxy: "Oscillator", Rpentomino: "Methuselah", Diehard: "Methuselah",
    Rabbits: "Methuselah", PufferTrain: "Puffer Train",
    Pufferfish: "Puffer Train", LightweightSpaceship2: "Spaceship", Snail: "Spaceship",
    Dart: "Spaceship", Spider: "Spaceship", QueenBee: "Still Life"
};

var maxCardCount=0;
var currentCardNumber=0;
var currentTeam = "blue";
var battleInProgress = false;
var battleTimerHandle = null;
var battleStartedAt = 0;
var battleDurationMs = 60000;
var previousBoardState = "";
var unchangedBoardFrames = 0;
var stableFramesRequired = 5;

var currentSelectedCreture=null;
var placingCretures=false;
const cards = document.getElementById("cards");
const battleFieldDiv = document.getElementById("battleField");
const mainMenuDIV = document.getElementById("mainMenu");
const video = document.getElementById("video");
const resultDiv = document.getElementById("result");
const cancelScanBtn = document.getElementById("cancelScan");

function stopCameraStream() {
    if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
    }
    if (video.pause) {
        video.pause();
    }
}

function showMainMenu() {
    mainMenuDIV.style.display = "flex";
    battleFieldDiv.style.display = "none";
    video.style.display = "none";
    cancelScanBtn.style.display = "none";
    resultDiv.style.display = "block";
    stopCameraStream();
}

function showScanner() {
    mainMenuDIV.style.display = "none";
    battleFieldDiv.style.display = "none";
    video.style.display = "block";
    cancelScanBtn.style.display = "block";
    resultDiv.style.display = "block";
}

function cancelScan() {
    resultDiv.innerText = "Scanning cancelled.";
    showMainMenu();
}

function getTeamColor(teamName) {
    if (teamName === "red") return "#ef4444";
    return "#3b82f6";
}

function getCellCount(teamName) {
    const cells = battleFieldDiv.querySelectorAll(".divInner");
    let count = 0;

    cells.forEach(cell => {
        if (cell.dataset.team === teamName) count += 1;
    });

    return count;
}

function getBoardState() {
    const cells = battleFieldDiv.querySelectorAll(".divInner");
    return Array.from(cells, cell => cell.dataset.team || "").join("");
}

function hasLiveCells() {
    return getCellCount("blue") + getCellCount("red") > 0;
}

function updateBattleStatus() {
    if (!battleInProgress) return;

    const remainingMs = Math.max(0, battleStartedAt + battleDurationMs - Date.now());
    const secondsLeft = Math.ceil(remainingMs / 1000);
    const mins = Math.floor(secondsLeft / 60);
    const secs = secondsLeft % 60;

    resultDiv.innerText = "Battle in progress: " + mins + ":" + String(secs).padStart(2, "0");
}

function finishBattle(endReason) {
    if (!battleInProgress) return;

    clearInterval(battleTimerHandle);
    battleTimerHandle = null;
    battleInProgress = false;

    const blueCount = getCellCount("blue");
    const redCount = getCellCount("red");

    let resultMessage;
    if (blueCount > redCount) {
        resultMessage = "Blue team wins!";
    } else if (redCount > blueCount) {
        resultMessage = "Red team wins!";
    } else {
        resultMessage = "Tie game!";
    }

    const reasonMessage = endReason ? "\n" + endReason : "";
    const countMessage = "\nBlue blocks: " + blueCount + "\nRed blocks: " + redCount;
    const finalMessage = resultMessage + reasonMessage + countMessage;
    resultDiv.innerText = finalMessage;
    alert(finalMessage);
}

function getBoardCell(x, y) {
    return document.getElementById('x' + x + ',y' + y);
}

function syncCellAppearance(cell) {
    if (!cell) return;

    const team = cell.dataset.team || "";
    if (!team) {
        cell.innerHTML = " ";
        cell.style.background = "rgba(255,255,255,0.08)";
        cell.style.color = "white";
        return;
    }

    cell.innerHTML = "■";
    cell.style.background = team === "blue" ? "#3b82f6" : "#ef4444";
    cell.style.color = team === "blue" ? "#dbeafe" : "#fee2e2";
}

function tickConwayBattle() {
    const nextTeams = new Map();
    const width = 40;
    const height = 140;

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const cell = getBoardCell(x, y);
            const currentTeam = cell && cell.dataset.team ? cell.dataset.team : "";
            let liveNeighbors = 0;
            let blueNeighbors = 0;
            let redNeighbors = 0;

            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;

                    const nx = x + dx;
                    const ny = y + dy;
                    if (nx < 0 || ny < 0 || nx >= width || ny >= height) continue;

                    const neighbor = getBoardCell(nx, ny);
                    if (!neighbor || !neighbor.dataset.team) continue;

                    liveNeighbors += 1;
                    if (neighbor.dataset.team === "blue") blueNeighbors += 1;
                    else if (neighbor.dataset.team === "red") redNeighbors += 1;
                }
            }

            if (currentTeam) {
                if (liveNeighbors === 2 || liveNeighbors === 3) {
                    nextTeams.set(x + "," + y, currentTeam);
                }
            } else if (liveNeighbors === 3) {
                if (blueNeighbors > redNeighbors) nextTeams.set(x + "," + y, "blue");
                else if (redNeighbors > blueNeighbors) nextTeams.set(x + "," + y, "red");
            }
        }
    }

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const cell = getBoardCell(x, y);
            const nextTeam = nextTeams.get(x + "," + y) || "";
            cell.dataset.team = nextTeam;
            syncCellAppearance(cell);
        }
    }
}

function normalizeCreatureName(rawName) {
    let value = String(rawName || "").trim();
    if (!value) return "";

    try {
        value = decodeURIComponent(value);
    } catch (error) {
    }

    value = value.split(/[?#]/)[0].split(/[\\/]/).pop();
    value = value.replace(/\.png$/i, "").trim();

    const aliases = {
        sailboat: "Sailboat",
        glider1: "Glider1",
        gun1: "gun1",
        lightweightspaceship: "LightweightSpaceship",
        middleweightspaceship: "MiddleweightSpaceship",
        heavyweightspaceship: "HeavyweightSpaceship"
    };

    return aliases[value.toLowerCase()] || value;
}

function getCreatureByName(rawName) {
    const exact = normalizeCreatureName(rawName);
    if (creatures[exact]) {
        return creatures[exact];
    }

    const lowerName = exact.toLowerCase();
    for (const key of Object.keys(creatures)) {
        if (key.toLowerCase() === lowerName) {
            return creatures[key];
        }
    }

    return null;
}

function getCardMatrix() {
    if (!Array.isArray(p1deck) || currentCardNumber < 0 || currentCardNumber >= p1deck.length) {
        return null;
    }

    const cardName = p1deck[currentCardNumber] && p1deck[currentCardNumber].creatureName;
    const pattern = getCreatureByName(cardName);
    if (!pattern) {
        return null;
    }

    return pattern;
}

function initBattle() {
    mainMenuDIV.style.display = "none";
    battleFieldDiv.style.display = "block";
    currentTeam = "blue";
    battleInProgress = false;
    clearInterval(battleTimerHandle);
    battleTimerHandle = null;
    previousBoardState = "";
    unchangedBoardFrames = 0;

    var width = 40;
    var height = 140;
    var xc, yc;
    var htmlOutput = '<div class="container">';

    for (yc = 0; yc < height; yc++) {
        for (xc = 0; xc < width; xc++) {
            htmlOutput += "<div class='divInner' onclick='handleClick(this.id)' id='x" + xc + ",y" + yc + "'>　</div>";
        } 
        htmlOutput += "<br>";
    }

    htmlOutput += '</div>';
    htmlOutput += `
<div class="controls">
    <button onclick="rotateCreture()">回転</button>
    <button onclick="startBattle()">バットル・スタート</button>
</div>
`;
    battleFieldDiv.innerHTML = htmlOutput;
    resultDiv.innerText = "Blue team's turn";
    placeConwaysCreatures();
}

function placeConwaysCreatures() {
    if (!currentSelectedCreture) {
        currentSelectedCreture = getCardMatrix();
    }

    if (!currentSelectedCreture) {
        return;
    }

    currentSelectedCreture.width=currentSelectedCreture[0].length;
    currentSelectedCreture.height=currentSelectedCreture.length;
    placingCretures=true;
}
function canPlaceCreature(creature, startX, startY) {
    for (let yc = 0; yc < creature.length; yc++) {
        for (let xc = 0; xc < creature[0].length; xc++) {
            const char = creature[yc][xc];
            if (char !== "■") continue;

            const targetX = startX + xc;
            const targetY = startY + yc;
            const cell = document.getElementById('x' + targetX + ',y' + targetY);

            if (!cell) return false;
            if (cell.innerHTML === "■" || cell.dataset.team) {
                return false;
            }
        }
    }
    return true;
}
function handleClick(id) {
    if (battleInProgress) {
        resultDiv.innerText = "Battle is already in progress.";
        return;
    }

    currentSelectedCreture = getCardMatrix();

    if (!currentSelectedCreture) {
        alert("先にカードを追加してください。");
        return;
    }

    const matches = id.match(/\d+/g);
    if (!matches || matches.length < 2) {
        alert("無効なセルです。");
        return;
    }

    const numbers = matches.map(Number);
    const clickedX = numbers[0];
    const clickedY = numbers[1];

    if (!canPlaceCreature(currentSelectedCreture, clickedX, clickedY)) {
        alert("Cannot place here! it is overlapping with other creature!");
        return;
    }

    const teamName = currentTeam;
    const teamColor = getTeamColor(teamName);

    for (let yc = 0; yc < currentSelectedCreture.length; yc++) {
        for (let xc = 0; xc < currentSelectedCreture[0].length; xc++) {
            if (currentSelectedCreture[yc][xc] !== "■") continue;

            const targetX = clickedX + xc;
            const targetY = clickedY + yc;
            const cell = document.getElementById('x' + targetX + ',y' + targetY);

            if (cell) {
                cell.innerHTML = currentSelectedCreture[yc][xc];
                cell.dataset.team = teamName;
                cell.style.color = teamColor;
                cell.style.background = teamColor;
            }
        }
    }

    currentCardNumber += 1;
    currentTeam = currentTeam === "blue" ? "red" : "blue";

    if (currentCardNumber < maxCardCount) {
        currentSelectedCreture = getCardMatrix();
        resultDiv.innerText = currentTeam === "blue" ? "Blue team's turn" : "Red team's turn";
    } else {
        resultDiv.innerText = "All creatures placed. Press battle start when ready.";
        currentSelectedCreture = null;
    }
}
function rotateCreature90(creature) {
    const height = creature.length;
    const width = creature[0].length;
    const result = [];

    for (let x = 0; x < width; x++) {
        let newRow = "";
        for (let y = height - 1; y >= 0; y--) {
            newRow += creature[y][x];
        }
        result.push(newRow);
    }
    return result;
}
function rotateCreture() {
    if (!currentSelectedCreture) {
        alert("回転するクリーチャーを選択してください。");
        return;
    }

    currentSelectedCreture = rotateCreature90(currentSelectedCreture);
    currentSelectedCreture.width = currentSelectedCreture[0].length;
    currentSelectedCreture.height = currentSelectedCreture.length;
    alert(currentSelectedCreture.join("\n"));
}
function startBattle(){
    if (battleInProgress) {
        return;
    }

    const secondsPrompt = prompt("How long would you like the battle to last in seconds?", "60");
    const seconds = Number(secondsPrompt);
    const safeSeconds = Number.isFinite(seconds) && seconds > 0 ? seconds : 60;

    battleInProgress = true;
    battleDurationMs = safeSeconds * 1000;
    battleStartedAt = Date.now();
    previousBoardState = getBoardState();
    unchangedBoardFrames = 0;
    updateBattleStatus();

    battleTimerHandle = setInterval(function() {
        if (Date.now() >= battleStartedAt + battleDurationMs) {
            finishBattle();
            return;
        }

        tickConwayBattle();
        const currentBoardState = getBoardState();
        if (!hasLiveCells()) {
            finishBattle("All cells are empty.");
            return;
        }

        if (currentBoardState === previousBoardState) {
            unchangedBoardFrames += 1;
        } else {
            unchangedBoardFrames = 0;
        }

        if (unchangedBoardFrames >= stableFramesRequired) {
            finishBattle("The board reached a stable configuration.");
            return;
        }

        previousBoardState = currentBoardState;
        updateBattleStatus();
    }, 450);
}
var p1deck=[];
var p2deck=[];

function scanQR() {
    showScanner();

    if (!("BarcodeDetector" in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        resultDiv.innerText = "PLEASE RUNT HIS ON AN MODERN ANDROID DEVICE.";
        showMainMenu();
        return;
    }

    const barcodeDetector = new BarcodeDetector({ formats: ["qr_code"] });

    navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }
    })
    .then(stream => {
        video.srcObject = stream;

        video.onloadedmetadata = () => {
            video.play().catch(() => {
                resultDiv.innerText = "Camera start failed.";
                showMainMenu();
            });
            resultDiv.innerText = "Scanning...";
            requestAnimationFrame(scanFrame);
        };
    })
    .catch(err => {
        resultDiv.innerText = "Camera error: " + err.message;
        showMainMenu();
    });

    function scanFrame() {
        if (video.readyState >= 2) {
            barcodeDetector.detect(video)
            .then(barcodes => {
                if (barcodes.length > 0) {
                    const cards = document.getElementById("cards");
                    var cardName = normalizeCreatureName(barcodes[0].rawValue);
                    var creature = getCreatureByName(cardName);

                    if (!creature) {
                        alert("invalid card!");
                        showMainMenu();
                        return;
                    }

                    const safeName = cardName.replace(/[^a-zA-Z0-9_]/g, "_");
                    cards.innerHTML = cards.innerHTML + "<div id='" + maxCardCount + "'>ID:" + maxCardCount + "Name:" + cardName + "<img src='images/cards/" + safeName + ".png' height=100 width=70></div>";
                    p1deck[maxCardCount] = { creatureName: cardName };
                    maxCardCount++;
                    showMainMenu();
                } else {
                    requestAnimationFrame(scanFrame);
                }
            })
            .catch(err => {
                resultDiv.innerText = "Scan error: " + err.message;
                showMainMenu();
            });
        } else {
            requestAnimationFrame(scanFrame);
        }
    }
}
</script>

</body>
</html>
